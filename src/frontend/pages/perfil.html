<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <title>Perfil | TrucoHub</title>
  <script type="module" src="js/utils/layout.js"></script>
  <script type="module" src="js/perfil.js"></script>
</head>
<body data-pagina="perfil">
  <!-- T07 – Perfil do jogador: consultar (RF003). Editar e excluir ficam na T17. -->
  <main class="principal">
    <p id="mensagem" class="mensagem" role="status" aria-live="polite" hidden></p>

    <section id="sem-jogador" class="painel" hidden>
      <h1>Perfil</h1>
      <p class="texto-suave">Nenhum perfil selecionado. Crie sua conta ou busque um jogador.</p>
      <div class="acoes">
        <a class="botao" href="cadastro.html">Criar conta</a>
        <a class="botao fantasma" href="jogadores.html">Buscar jogadores</a>
      </div>
    </section>

    <div id="conteudo-perfil" class="pilha" hidden>
      <section class="painel cartao-perfil" aria-labelledby="perfil-nome">
        <span id="perfil-avatar"></span>
        <div class="dados">
          <h1 id="perfil-nome" class="nome"></h1>
          <p id="perfil-detalhe" class="subtitulo"></p>
        </div>
        <!-- Perfil próprio: Editar perfil e Sair. Perfil de outro jogador: Adicionar amigo. -->
        <div id="acoes-proprio" class="acoes" hidden>
          <a class="botao secundario" href="editar-perfil.html">Editar perfil</a>
          <button id="botao-sair" type="button" class="botao fantasma">Sair</button>
        </div>
        <div id="acoes-outro" class="acoes" hidden>
          <span class="botao fantasma" aria-disabled="true" title="Em breve">Adicionar amigo</span>
        </div>
      </section>

      <div class="grade-estatisticas">
        <div class="card-estatistica">
          <span class="rotulo">Partidas</span><span class="valor">—</span>
        </div>
        <div class="card-estatistica">
          <span class="rotulo">Vitórias</span><span class="valor">—</span>
        </div>
        <div class="card-estatistica">
          <span class="rotulo">Derrotas</span><span class="valor">—</span>
        </div>
        <div class="card-estatistica">
          <span class="rotulo">Aproveitamento</span><span class="valor">—</span>
        </div>
      </div>

      <div class="colunas">
        <section class="secao" aria-labelledby="titulo-duplas">
          <h2 id="titulo-duplas" class="titulo-secao">Duplas</h2>
          <p class="vazio">Nenhuma dupla ainda.</p>
        </section>
        <section class="secao" aria-labelledby="titulo-partidas">
          <h2 id="titulo-partidas" class="titulo-secao">Últimas partidas</h2>
          <p class="vazio">Nenhuma partida ainda.</p>
        </section>
      </div>
    </div>
  </main>
</body>
</html>
